<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="/">Biblioteca</a>
    {% if current_user %}
    <nav>
      <a href="/personas">Personas</a><a href="/socios">Socios</a><a href="/bibliotecarios">Bibliotecarios</a>
      <a href="/libros">Libros</a><a href="/autores">Autores</a><a href="/editoriales">Editoriales</a>
      <a href="/ejemplares">Ejemplares</a><a href="/prestamos">Préstamos</a>
    </nav>
    <div class="session-info">
      <span>{{ current_user.username }} · {{ current_user.role }}</span>
      <form method="post" action="/logout"><button class="logout-button">Cerrar sesión</button></form>
    </div>
    {% endif %}
  </header>
  <main>
    {% if mensaje %}<div class="alert success">{{ mensaje }}</div>{% endif %}
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
