[project]
name = "tpi-python"
version = "0.1.0"
description = "Aplicación web educativa para gestionar una biblioteca"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "email-validator>=2.2,<3",
    "jinja2>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymysql>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]
